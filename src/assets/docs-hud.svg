<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GoAgent Lab documentation interface</title>
  <desc id="desc">A graphite glass documentation interface with navigation, content panels, and calm index signals.</desc>
  <defs>
    <linearGradient id="glassFrame" x1="96" y1="78" x2="846" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32363F" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#24252B" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#1B1B1F" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="glassPanel" x1="160" y1="226" x2="812" y2="536" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F7FF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#DDEBFA" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="sidePanel" x1="130" y1="232" x2="328" y2="522" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F1FB" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#C9D8EA" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="terminalGlow" x1="138" y1="118" x2="824" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8B1FF" stop-opacity="0.24"/>
      <stop offset="0.52" stop-color="#3DD68C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#EEF0FF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="168" y1="472" x2="792" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8B1FF"/>
      <stop offset="0.5" stop-color="#3DD68C"/>
      <stop offset="1" stop-color="#C8ABFA"/>
    </linearGradient>
    <filter id="softShadow" x="40" y="36" width="880" height="660" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#111827" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#A8B1FF" flood-opacity="0.08"/>
    </filter>
  </defs>

